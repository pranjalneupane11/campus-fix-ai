spring.application.name=campus-fix-api

# ---- Database (all values come from environment variables; see .env.example) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_fix_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Managed via db/migration/V1__init.sql; disable Hibernate auto-DDL to keep schema explicit.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- OpenAI ----
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- Logging ----
logging.level.com.campusfix.api=INFO
